name: Rfmd
description: 'RFMD (RF Micro Devices) was a semiconductor manufacturer of radio-frequency
  (RF) components for mobile, infrastructure, defense, and aerospace markets. In January
  2015 RFMD merged with TriQuint Semiconductor to form Qorvo, and the rfmd.com domain
  now redirects to qorvo.com. Qorvo designs and manufactures RF and power solutions
  — amplifiers, filters, integrated circuits, wireless connectivity, and power management
  devices — spanning mobile, defense/aerospace, network infrastructure, IoT, automotive,
  and consumer electronics. As a hardware semiconductor company, RFMD/Qorvo publishes
  no public developer web API; its developer-facing resources are simulation models,
  QSPICE circuit-simulation software, datasheets, evaluation boards, and a technical
  support forum. This profile was surfaced as a portfolio lead of norwest-venture-partners
  and enriched to reflect the RFMD-to-Qorvo identity; there is no API surface to catalog.'
